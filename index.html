<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quer namorar comigo?</title>
    <link href="https://googleapis.com" rel="family">
    <style>
        body {
            background-color: #ffc8dd;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #590d22;
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }
        .buttons {
            display: flex;
            gap: 20px;
        }
        button {
            background-color: #ffb3c1;
            color: #590d22;
            border: 3px ridge #ffb3c1;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        #btn-nao {
            font-size: 8px; /* Mantendo a escala proporcional do seu código */
            position: absolute;
        }
    </style>
</head>
<body>

    <h1>Quer namorar comigo?</h1>
    
    <div class="buttons">
        <button id="btn-sim" onclick="accepted()">Sim</button>
        <button id="btn-nao" onmouseover="moveButton()" onclick="denied()">Não</button>
    </div>

    <script>
        const btnNao = document.getElementById('btn-nao');

        // Posiciona o botão "Não" inicialmente perto do sim
        resetNaoButton();

        function resetNaoButton() {
            btnNao.style.position = 'absolute';
            btnNao.style.left = (window.innerWidth / 2 + 20) + 'px';
            btnNao.style.top = (window.innerHeight / 2 + 20) + 'px';
        }

        function moveButton() {
            // Gera posições aleatórias na tela de forma similar ao seu código Python
            const maxX = window.innerWidth - btnNao.offsetWidth;
            const maxY = window.innerHeight - btnNao.offsetHeight;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            btnNao.style.left = randomX + 'px';
            btnNao.style.top = randomY + 'px';
        }

        function accepted() {
            alert('Meu amor eu te amo muito, quero minha torta de limao');
        }

        function denied() {
            btnNao.style.display = 'none';
        }
    </script>
</body>
</html>
